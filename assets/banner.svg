<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 440"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#04060d"/><stop offset="35%" stop-color="#0b1120"/><stop offset="70%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="title-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="35%" stop-color="#60a5fa"/><stop offset="70%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.98)"/></linearGradient><linearGradient id="laser-cyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/><stop offset="50%" stop-color="#38bdf8" stop-opacity=".9"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></linearGradient><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="0" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)"/></pattern><filter id="ambient-glow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="14"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="badge-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes slowPulse{0%{opacity:.25;transform:scale(1)}50%{opacity:.65;transform:scale(1.12)}}@keyframes floatDataFlow{0%{stroke-dashoffset:600}}@keyframes floatParticleY{0%{transform:translateY(0);opacity:.2}50%{transform:translateY(-20px);opacity:.85}}@keyframes beamScan{0%{transform:translateX(-1200px)}}.banner-tag{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:11px;font-weight:700;fill:#38bdf8;letter-spacing:2px}.banner-heading,.banner-subheading{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:900;font-size:42px;fill:#fff;letter-spacing:-.6px}.banner-subheading{font-weight:500;font-size:17px;fill:#94a3b8;letter-spacing:.2px}.pill-label{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;font-weight:600;fill:#e2e8f0}.pill-box{stroke:rgba(56,189,248,.4);stroke-width:1.5;rx:17}.ambient-orb-1{animation:slowPulse 8s ease-in-out infinite;transform-origin:220px 100px}.ambient-orb-2{animation:slowPulse 10s ease-in-out infinite 3s;transform-origin:980px 340px}.circuit-flow{stroke-dasharray:14,18;animation:floatDataFlow 24s linear infinite}.circuit-flow-fast{stroke-dasharray:8,12;animation:floatDataFlow 16s linear infinite}.scan-beam{animation:beamScan 7s cubic-bezier(.4,0,.2,1) infinite}.particle-a{animation:floatParticleY 5s ease-in-out infinite}.particle-b{animation:floatParticleY 7s ease-in-out infinite 2s}.particle-c{animation:floatParticleY 6s ease-in-out infinite 3.5s}</style></defs><rect width="100%" height="100%" fill="url(#bg-grad)"/><rect width="100%" height="100%" fill="url(#grid-pattern)"/><g class="ambient-orb-1" filter="url(#ambient-glow)"><circle cx="200" cy="90" r="140" fill="#0284c7" opacity=".18"/><circle cx="280" cy="150" r="90" fill="#6366f1" opacity=".2"/></g><g class="ambient-orb-2" filter="url(#ambient-glow)"><circle cx="1000" cy="350" r="160" fill="#a855f7" opacity=".18"/><circle cx="920" cy="280" r="100" fill="#38bdf8" opacity=".2"/></g><g opacity=".38"><path fill="none" stroke="#38bdf8" stroke-width="2" d="M 0 70 Q 300 130 600 50 T 1200 80" class="circuit-flow"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M 0 370 Q 400 310 800 370 T 1200 340" class="circuit-flow"/><path fill="none" stroke="#c084fc" stroke-width="1.5" d="M 120 0 L 190 140 L 290 200 L 420 440" class="circuit-flow-fast" opacity=".35"/><path fill="none" stroke="#38bdf8" stroke-width="1.5" d="M 1080 0 L 1010 140 L 910 210 L 780 440" class="circuit-flow-fast" opacity=".35"/></g><circle cx="160" cy="270" r="3" fill="#38bdf8" class="particle-a"/><circle cx="1040" cy="110" r="3.5" fill="#818cf8" class="particle-b"/><circle cx="600" cy="390" r="2.5" fill="#c084fc" class="particle-c"/><circle cx="880" cy="70" r="2.5" fill="#38bdf8" class="particle-a"/><circle cx="320" cy="380" r="3" fill="#60a5fa" class="particle-b"/><g class="scan-beam" opacity=".7"><rect width="400" height="2" x="0" y="0" fill="url(#laser-cyan)"/></g><g transform="translate(600, 75)"><rect width="380" height="36" x="-190" y="-18" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1.2" rx="18"/><circle cx="-162" cy="0" r="4.5" fill="#38bdf8" filter="url(#badge-glow)"/><text y="4" class="banner-tag" text-anchor="middle">HIGH-PERFORMANCE SYSTEMS &amp; COMPILERS</text></g><text x="600" y="156" class="banner-heading" text-anchor="middle">Compiler Infrastructure &amp; Runtimes</text><rect width="380" height="4" x="410" y="177" fill="url(#title-glow)" rx="2"/><text x="600" y="218" class="banner-subheading" text-anchor="middle">LLVM · MLIR · Triton · GPU Runtimes · Accelerated Hardware Compilers · Sandboxes</text><g><g transform="translate(600, 298) translate(-465, 0)"><rect width="142" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="71" y="5" class="pill-label" text-anchor="middle">⚙️ LLVM / Clang</text></g><g transform="translate(600, 298) translate(-305, 0)"><rect width="146" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="73" y="5" class="pill-label" text-anchor="middle">🧬 MLIR Dialects</text></g><g transform="translate(600, 298) translate(-142, 0)"><rect width="134" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="67" y="5" class="pill-label" text-anchor="middle">⚡ Triton GPU</text></g><g transform="translate(600, 298) translate(8, 0)"><rect width="140" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="70" y="5" class="pill-label" text-anchor="middle">🚀 OpenXLA / TVM</text></g><g transform="translate(600, 298) translate(164, 0)"><rect width="142" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="71" y="5" class="pill-label" text-anchor="middle">🔥 SYCL &amp; ROCm</text></g><g transform="translate(600, 298) translate(322, 0)"><rect width="142" height="34" x="0" y="-17" fill="url(#pill-bg)" class="pill-box"/><text x="71" y="5" class="pill-label" text-anchor="middle">🧪 Sandboxes</text></g></g><text x="600" y="375" fill="#64748b" font-family="ui-monospace, monospace" font-size="11.5" letter-spacing="1.2" text-anchor="middle">OPEN-SOURCE ECOSYSTEMS · COMMERCIAL SAAS · COMPILER TOOLCHAINS · JIT &amp; AOT</text></svg>