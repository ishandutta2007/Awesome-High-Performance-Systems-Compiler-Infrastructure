<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c1222" />
      <stop offset="100%" stop-color="#060810" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Gradient -->
    <linearGradient id="pill-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.85)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.95)" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 500;
        font-size: 18px;
        fill: #94a3b8;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #38bdf8;
      }
      .pill-border {
        stroke: rgba(56, 189, 248, 0.35);
        stroke-width: 1.5;
        rx: 16;
      }
      /* Ambient dynamic animation */
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes floatParticle {
        0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
        50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
        100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      }
      @keyframes circuitFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .dynamic-orb-1 {
        animation: pulseGlow 7s ease-in-out infinite;
        transform-origin: 200px 100px;
      }
      .dynamic-orb-2 {
        animation: pulseGlow 9s ease-in-out infinite 3s;
        transform-origin: 1000px 320px;
      }
      .flowing-line {
        stroke-dasharray: 20, 15;
        animation: circuitFlow 18s linear infinite;
      }
      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 4s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Background Animated Ambient Glow Orbs -->
  <g class="dynamic-orb-1" filter="url(#glow)">
    <circle cx="200" cy="90" r="140" fill="#38bdf8" opacity="0.15" />
    <circle cx="250" cy="140" r="90" fill="#818cf8" opacity="0.2" />
  </g>
  <g class="dynamic-orb-2" filter="url(#glow)">
    <circle cx="1020" cy="330" r="160" fill="#c084fc" opacity="0.15" />
    <circle cx="960" cy="270" r="100" fill="#38bdf8" opacity="0.18" />
  </g>

  <!-- Background Animated Circuit Lines -->
  <g opacity="0.45">
    <path class="flowing-line" d="M 0 80 Q 300 120 600 60 T 1200 90" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="flowing-line" d="M 0 350 Q 400 310 800 360 T 1200 330" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="flowing-line" d="M 150 0 L 220 180 L 320 220 L 450 420" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.3" />
    <path class="flowing-line" d="M 1050 0 L 980 180 L 880 240 L 800 420" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="180" cy="280" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="1050" cy="120" r="3.5" fill="#818cf8" />
  <circle class="particle-3" cx="620" cy="380" r="2.5" fill="#c084fc" />
  <circle class="particle-1" cx="890" cy="80" r="3" fill="#38bdf8" />

  <!-- Foreground Content: Header Badge -->
  <g transform="translate(600, 75)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="rgba(30, 41, 59, 0.7)" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1" />
    <circle cx="-140" cy="0" r="4" fill="#38bdf8" />
    <text text-anchor="middle" y="5" font-family="ui-monospace, monospace" font-size="12" font-weight="600" fill="#cbd5e1" letter-spacing="1.5">HIGH-PERFORMANCE SYSTEMS &amp; COMPILERS</text>
  </g>

  <!-- Foreground Title -->
  <text class="title-text" text-anchor="middle" x="600" y="155">
    Compiler Infrastructure &amp; Runtimes
  </text>

  <!-- Decorative Gradient Underline -->
  <rect x="420" y="175" width="360" height="4" rx="2" fill="url(#primary-glow)" />

  <!-- Foreground Subtitle -->
  <text class="subtitle-text" text-anchor="middle" x="600" y="215">
    LLVM · MLIR · Triton · GPU Runtimes · Accelerated Hardware Compilers · Sandboxes
  </text>

  <!-- Foreground Tags / Feature Pills -->
  <g transform="translate(600, 290)">
    <!-- Pill 1: LLVM & Clang -->
    <g transform="translate(-460, 0)">
      <rect class="pill-border" x="0" y="-18" width="140" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="70" y="5">⚙️ LLVM / Clang</text>
    </g>

    <!-- Pill 2: MLIR & Dialects -->
    <g transform="translate(-300, 0)">
      <rect class="pill-border" x="0" y="-18" width="145" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="72" y="5">🧬 MLIR Dialects</text>
    </g>

    <!-- Pill 3: OpenAI Triton -->
    <g transform="translate(-135, 0)">
      <rect class="pill-border" x="0" y="-18" width="130" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="65" y="5">⚡ Triton GPU</text>
    </g>

    <!-- Pill 4: OpenXLA / TVM -->
    <g transform="translate(15, 0)">
      <rect class="pill-border" x="0" y="-18" width="135" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="67" y="5">🚀 OpenXLA / TVM</text>
    </g>

    <!-- Pill 5: SYCL / ROCm -->
    <g transform="translate(170, 0)">
      <rect class="pill-border" x="0" y="-18" width="135" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="67" y="5">🔥 SYCL &amp; ROCm</text>
    </g>

    <!-- Pill 6: Sandboxes -->
    <g transform="translate(325, 0)">
      <rect class="pill-border" x="0" y="-18" width="135" height="36" fill="url(#pill-grad)" />
      <text class="pill-text" text-anchor="middle" x="67" y="5">🧪 Sandboxes</text>
    </g>
  </g>
</svg>
