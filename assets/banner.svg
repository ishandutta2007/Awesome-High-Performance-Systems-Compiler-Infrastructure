<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d" />
      <stop offset="35%" stop-color="#0b1120" />
      <stop offset="70%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Title Gradient -->
    <linearGradient id="title-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#60a5fa" />
      <stop offset="70%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Pill Fill Gradient -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.9)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.98)" />
    </linearGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laser-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="0" cy="0" r="1.5" fill="rgba(56, 189, 248, 0.15)" />
    </pattern>

    <!-- Glow Filter for Ambient Background Elements -->
    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      /* Text Typography - Guaranteed Foreground Clarity */
      .banner-tag {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 700;
        fill: #38bdf8;
        letter-spacing: 2px;
      }
      .banner-heading {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 42px;
        fill: #ffffff;
        letter-spacing: -0.6px;
      }
      .banner-subheading {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 17px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-label {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12.5px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      .pill-box {
        stroke: rgba(56, 189, 248, 0.4);
        stroke-width: 1.5;
        rx: 17;
      }

      /* Non-intrusive Background Dynamic Animations */
      @keyframes slowPulse {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes floatDataFlow {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes floatParticleY {
        0%, 100% { transform: translateY(0px); opacity: 0.2; }
        50% { transform: translateY(-20px); opacity: 0.85; }
      }
      @keyframes beamScan {
        0% { transform: translateX(-1200px); }
        100% { transform: translateX(1200px); }
      }

      .ambient-orb-1 {
        animation: slowPulse 8s ease-in-out infinite;
        transform-origin: 220px 100px;
      }
      .ambient-orb-2 {
        animation: slowPulse 10s ease-in-out infinite 3s;
        transform-origin: 980px 340px;
      }
      .circuit-flow {
        stroke-dasharray: 14, 18;
        animation: floatDataFlow 24s linear infinite;
      }
      .circuit-flow-fast {
        stroke-dasharray: 8, 12;
        animation: floatDataFlow 16s linear infinite;
      }
      .scan-beam {
        animation: beamScan 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .particle-a { animation: floatParticleY 5s ease-in-out infinite; }
      .particle-b { animation: floatParticleY 7s ease-in-out infinite 2s; }
      .particle-c { animation: floatParticleY 6s ease-in-out infinite 3.5s; }
    </style>
  </defs>

  <!-- Layer 1: Background Gradient & Grid -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" />
  <rect width="100%" height="100%" fill="url(#grid-pattern)" />

  <!-- Layer 2: Deep Background Animated Orbs (Safely away from text center) -->
  <g class="ambient-orb-1" filter="url(#ambient-glow)">
    <circle cx="200" cy="90" r="140" fill="#0284c7" opacity="0.18" />
    <circle cx="280" cy="150" r="90" fill="#6366f1" opacity="0.2" />
  </g>
  <g class="ambient-orb-2" filter="url(#ambient-glow)">
    <circle cx="1000" cy="350" r="160" fill="#a855f7" opacity="0.18" />
    <circle cx="920" cy="280" r="100" fill="#38bdf8" opacity="0.2" />
  </g>

  <!-- Layer 3: Dynamic Data Flow Paths in Ambient Background -->
  <g opacity="0.38">
    <path class="circuit-flow" d="M 0 70 Q 300 130 600 50 T 1200 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="circuit-flow" d="M 0 370 Q 400 310 800 370 T 1200 340" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="circuit-flow-fast" d="M 120 0 L 190 140 L 290 200 L 420 440" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.35" />
    <path class="circuit-flow-fast" d="M 1080 0 L 1010 140 L 910 210 L 780 440" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.35" />
  </g>

  <!-- Layer 4: Ambient Floating Particles -->
  <circle class="particle-a" cx="160" cy="270" r="3" fill="#38bdf8" />
  <circle class="particle-b" cx="1040" cy="110" r="3.5" fill="#818cf8" />
  <circle class="particle-c" cx="600" cy="390" r="2.5" fill="#c084fc" />
  <circle class="particle-a" cx="880" cy="70" r="2.5" fill="#38bdf8" />
  <circle class="particle-b" cx="320" cy="380" r="3" fill="#60a5fa" />

  <!-- Scanning Laser Beam across Top Accent -->
  <g class="scan-beam" opacity="0.7">
    <rect x="0" y="0" width="400" height="2" fill="url(#laser-cyan)" />
  </g>

  <!-- Layer 5: Foreground UI Elements (Always on top, fully crisp & visible) -->

  <!-- Top Pill Badge -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="rgba(15, 23, 42, 0.88)" stroke="rgba(129, 140, 248, 0.45)" stroke-width="1.2" />
    <circle cx="-162" cy="0" r="4.5" fill="#38bdf8" filter="url(#badge-glow)" />
    <text text-anchor="middle" y="4" class="banner-tag">HIGH-PERFORMANCE SYSTEMS &amp; COMPILERS</text>
  </g>

  <!-- Main Title -->
  <text class="banner-heading" text-anchor="middle" x="600" y="156">
    Compiler Infrastructure &amp; Runtimes
  </text>

  <!-- Decorative Gradient Accent Bar -->
  <rect x="410" y="177" width="380" height="4" rx="2" fill="url(#title-glow)" />

  <!-- Subtitle -->
  <text class="banner-subheading" text-anchor="middle" x="600" y="218">
    LLVM · MLIR · Triton · GPU Runtimes · Accelerated Hardware Compilers · Sandboxes
  </text>

  <!-- Foreground Technology Badges / Pills -->
  <g transform="translate(600, 298)">
    <!-- Pill 1: LLVM & Clang -->
    <g transform="translate(-465, 0)">
      <rect class="pill-box" x="0" y="-17" width="142" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="71" y="5">⚙️ LLVM / Clang</text>
    </g>

    <!-- Pill 2: MLIR Dialects -->
    <g transform="translate(-305, 0)">
      <rect class="pill-box" x="0" y="-17" width="146" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="73" y="5">🧬 MLIR Dialects</text>
    </g>

    <!-- Pill 3: Triton GPU -->
    <g transform="translate(-142, 0)">
      <rect class="pill-box" x="0" y="-17" width="134" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="67" y="5">⚡ Triton GPU</text>
    </g>

    <!-- Pill 4: OpenXLA / TVM -->
    <g transform="translate(8, 0)">
      <rect class="pill-box" x="0" y="-17" width="140" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="70" y="5">🚀 OpenXLA / TVM</text>
    </g>

    <!-- Pill 5: SYCL / ROCm -->
    <g transform="translate(164, 0)">
      <rect class="pill-box" x="0" y="-17" width="142" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="71" y="5">🔥 SYCL &amp; ROCm</text>
    </g>

    <!-- Pill 6: Sandboxes -->
    <g transform="translate(322, 0)">
      <rect class="pill-box" x="0" y="-17" width="142" height="34" fill="url(#pill-bg)" />
      <text class="pill-label" text-anchor="middle" x="71" y="5">🧪 Sandboxes</text>
    </g>
  </g>

  <!-- Bottom Foreground Spec Line -->
  <text text-anchor="middle" x="600" y="375" font-family="ui-monospace, monospace" font-size="11.5" fill="#64748b" letter-spacing="1.2">
    OPEN-SOURCE ECOSYSTEMS · COMMERCIAL SAAS · COMPILER TOOLCHAINS · JIT &amp; AOT
  </text>
</svg>
